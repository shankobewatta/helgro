  ['සැලසුම් කරන්න','ඉඩම සකසන්න','වපුරන්න / සිටුවන්න','වගා කර රැකබලා ගන්න','අස්වනු නෙළන්න','ගබඩා කරන්න','විකුණන්න'],
  ['திட்டமிடு','நிலத்தைத் தயார் செய்','விதை / நடு','வளர்த்துப் பராமரி','அறுவடை செய்','சேமி','விற்கவும்']],
 animal:[['Get the animals','Feed and care','Vaccinate and treat','Ready for market','Sell'],
  ['සතුන් ලබාගන්න','ආහාර දී රැකබලා ගන්න','එන්නත් කර ප්‍රතිකාර කරන්න','වෙළඳපොලට සූදානම්','විකුණන්න'],
  ['விலங்குகளைப் பெறு','உணவளித்துப் பராமரி','தடுப்பூசி போட்டுச் சிகிச்சை அளி','சந்தைக்குத் தயார்','விற்கவும்']]};
const CH=[['crop','Paddy','වී','நெல்'],['crop','Tea','තේ','தேயிலை'],['crop','Coconut','පොල්','தென்னை'],['crop','Vegetables','එළවළු','காய்கறிகள்'],['crop','Rubber','රබර්','ரப்பர்'],['crop','Cinnamon','කුරුඳු','இலவங்கப்பட்டை'],
 ['animal','Cows','ගවයන්','மாடுகள்'],['animal','Goats','එළුවන්','ஆடுகள்'],['animal','Chickens','කුකුළන්','கோழிகள்']];
const ACTK=['water','fert','spray','weed','feed','vacc','med','other'];
const LOC=()=>['en-LK','si-LK','ta-LK'][LI];
const ic=i=>i.type==='crop'?'🌱':'🐄';
const find=id=>S.items.find(x=>x.id===id);
const num=n=>(Math.round(n*100)/100).toLocaleString('en-LK');
const rs=n=>'Rs '+num(n);
const costOf=i=>i.log.reduce((a,l)=>a+(+l.cost||0),0);
const fmtD=d=>(typeof d==='number'?new Date(d):parseFarmDate(d)).toLocaleDateString(LOC(),{day:'numeric',month:'short',year:'numeric'});
const prog=i=>Math.round(i.stage/(ST[i.type][0].length-1)*100);
const stg=(i,k)=>ST[i.type][LI][k];
const seasonS=i=>i.season?' · '+L(i.season).split(' (')[0]:'';
const logHead=l=>D['a_'+l.t]?L('a_'+l.t):l.t;
const logNote=(l,i)=>l.t==='step'&&ST[i.type][0][l.note]!=null?stg(i,l.note):l.t==='timer'&&(l.note==='on'||l.note==='off')?L(l.note==='on'?'tOn':'tOff'):l.note;
function cd(iso){const ms=parseFarmDate(iso)-Date.now();if(ms<=0)return L('ready');
 const u=L('u').split(' '),d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);
 return (d?d+u[0]+' ':'')+h+u[1]+' '+m+u[2]+(d?'':' '+s+u[3])}
const cdEl=iso=>`<div class="cd ${parseFarmDate(iso)<=Date.now()?'due':''}" data-t="${esc(iso)}">${cd(iso)}</div>`;

 <h2>${L('diaryH')}</h2>${i.log.slice().reverse().map(l=>`<div class="log"><b>${esc(logHead(l))}</b> <span class="mut">${fmtD(l.d)}${l.cost?' · '+rs(l.cost):''}</span><br>${esc(logNote(l,i))}</div>`).join('')||`<p class="mut">${L('noEntries')}</p>`}
 <p style="margin-top:24px"><button class="red" onclick="delItem('${id}')">${L('del')}</button></p>`}

 const w=S.items.filter(i=>i.harvest&&!i.sold).sort((a,b)=>parseFarmDate(a.harvest)-parseFarmDate(b.harvest));

 ${S.sales.slice().reverse().map(s=>`<div class="card"><div class="between"><b>${esc(s.name)}</b><b>${rs(s.total)}</b></div><div class="mut">${num(s.qty)} ${esc(s.unit)} × ${num(s.price)}${s.buyer?' · '+esc(s.buyer):''} · ${fmtD(s.d)}</div></div>`).join('')||`<p class="mut">${L('noS')}</p>`}`}

let chat=[],busy=false;
const msgHtml=()=>chat.map(m=>`<div class='msg ${m.r}'>${m.r==='a'?fmtT(m.t||L('thinking')):esc(m.t)}</div>`).join('');
function draw(){const c=$('#chat');if(!c)return;c.innerHTML=msgHtml();if(c.lastElementChild)c.lastElementChild.scrollIntoView({block:'nearest'})}
function vAsk(){return `<h1>${L('askT')}</h1><p class='mut'>${L('askIntro')}</p>
 <div id='chat'>${msgHtml()}</div>
 ${chat.length?'':[1,2,3].map(n=>`<button class='chip alt' style='display:block;width:100%;text-align:left;margin:0 0 8px;border-radius:14px;padding:10px 14px;min-height:48px' onclick='askQ(${n})'>${L('q'+n)}</button>`).join('')}
 <textarea id='q' rows='2' placeholder='${L('askPh')}' onkeydown='keyAsk(event)'></textarea>
 <div class='row'><button onclick='ask()'>${L('send')}</button>${chat.length?`<button class='alt' onclick='chat=[];render(true)'>${L('newChat')}</button>`:''}</div>
 <p class='mut'>${L('disc')}</p>`}
function askQ(n){ask(L('q'+n))}
function keyAsk(e){if(e.key==='Enter'&&!e.shiftKey&&!/Android|iPhone|iPad/i.test(navigator.userAgent)){e.preventDefault();ask()}}
async function ask(text){
 if(busy)return;
 const inp=$('#q'),q=String(text||(inp?inp.value:'')).trim();
 if(!q)return;
 busy=true;chat.push({r:'u',t:q},{r:'a',t:''});render(true);draw();
 const m=chat[chat.length-1];
 try{
  const sample=window.claude&&await claude.use('sample');
  if(!sample){m.t=L('na');return}
  const lang=['English','Sinhala (සිංහල)','Tamil (தமிழ்)'][LI];
  const ctx=S.items.filter(i=>!i.sold).map(i=>'- '+i.name+' ('+i.type+(i.season?', '+i.season+' season':'')+'), step: '+ST[i.type][0][i.stage]+(i.harvest?', harvest/market time: '+i.harvest:'')+'; recent diary: '+(i.log.slice(-3).map(l=>logHead(l)+(l.note?' - '+String(logNote(l,i)).slice(0,80):'')).join('; ')||'none')).join('\n')||'(no crops or animals added yet)';
  const hist=chat.slice(-8,-2).map(x=>(x.r==='u'?'Farmer: ':'Assistant: ')+x.t).join('\n');
  const p=`You are HELGRO’s friendly farm assistant for small-scale farmers in Sri Lanka. Reply entirely in ${lang}, in very simple words and short sentences (about 150 words at most). Give practical, low-cost advice for Sri Lankan conditions (Maha and Yala seasons, local crops, locally available inputs). For animal illness, pests or chemicals, say to follow the label and to ask a Veterinary Surgeon or the local agriculture instructor (Krushi Upadeshaka) if it is serious. If you are not sure, say so. Do not invent prices or government schemes.
The farmer’s farm right now:
${ctx}
Conversation so far:
${hist||'(none)'}
Farmer: ${q}
Assistant:`;
  const r=await sample(p,{cache:false,onText:({text})=>{m.t=text;draw()}});
  m.t=r.text;
 }catch(e){const c=e&&e.code;m.t=c==='not_granted'?L('denied'):c==='rate_limited'?L('rate'):L('askErr')}
 finally{busy=false;draw()}
}
const VIEWS={home:vHome,farm:vFarm,health:vHealth,ask:vAsk,harvest:vHarvest,sales:vSales};
const NAV=[['home','🏠'],['farm','🌱'],['health','🩺'],['ask','🤖'],['harvest','⏰'],['sales','💰']];
function render(keep){
 $('#hd').innerHTML=`<div class="brand"><span class="logo">🌾</span><div><b>HELGRO</b><small>${L('tag')}</small></div></div>
 <div class="lang">${['English','සිංහල','தமிழ்'].map((n,k)=>`<button class="${k===LI?'on':''}" onclick="setLang(${k})">${n}</button>`).join('')}</div>`;
 $('#nv').innerHTML=NAV.map(([v,e])=>`<button class="${v===view?'on':''}" onclick="go('${v}')"><span>${e}</span>${L(v)}</button>`).join('');
 $('#app').innerHTML=VIEWS[view]();
 if(!keep)window.scrollTo(0,0)}
function setLang(k){LI=k;try{localStorage.setItem(LK,k)}catch(e){}document.documentElement.lang=['en','si','ta'][k];render(true)}
function go(v,add){view=v;sel=null;adding=!!add;render()}
function openItem(id){view='farm';sel=id;render()}
function pick(k){$('#n').value=CH[k][LI+1];$('#t').value=CH[k][0]}
function addItem(){
 const n=$('#n').value.trim();
 if(!n){alert(L('needName'));return}
 const it={id:uid(),name:n,type:$('#t').value,season:$('#se').value,stage:0,start:$('#s').value||today(),harvest:$('#h').value,events:[],log:[],sold:false};
 it.events.push({id:uid(),type:0,title:L('activityTypes')[LI][0],date:it.start,note:''});
 if(it.harvest)it.events.push({id:uid(),type:5,title:L('activityTypes')[LI][5],date:it.harvest.slice(0,10),note:''});
 it.log.push({d:Date.now(),t:'start',note:n,cost:0});
 S.items.push(it);save();adding=false;sel=it.id;render()}
function setStage(id,k){
 const i=find(id);if(i.stage===k)return;i.stage=k;
 i.log.push({d:Date.now(),t:'step',note:k,cost:0});save();render()}
function setHarvest(id){
 const i=find(id);i.harvest=$('#hv').value;
 i.events=(i.events||[]).filter(e=>e.type!==5);
 if(i.harvest)i.events.push({id:uid(),type:5,title:L('activityTypes')[LI][5],date:i.harvest.slice(0,10),note:''});
 i.log.push({d:Date.now(),t:'timer',note:i.harvest?'on':'off',cost:0});save();render()}
function addFarmEvent(id){
 const i=find(id),date=$('#evdate').value;
 if(!date){alert(L('eventDate'));return}
 const type=+$('#evtype').value;
 i.events=i.events||[];
 i.events.push({id:uid(),type,title:L('activityTypes')[LI][type],date,note:$('#evnote').value.trim()});
 save();render()
}
function editFarmEvent(id,eventId){
 const i=find(id),e=(i.events||[]).find(x=>x.id===eventId);if(!e)return;
 const date=prompt(L('eventDate'),e.date);if(date===null)return;
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert(L('eventDate'));return}
 const note=prompt(L('eventNote'),e.note||'');if(note===null)return;
 e.date=date;e.note=note;save();render()
}
function deleteFarmEvent(id,eventId){
 const i=find(id);if(!confirm(L('deleteEvent')+'?'))return;
 i.events=(i.events||[]).filter(e=>e.id!==eventId);save();render()
}
function logWork(id){
 const i=find(id);
 i.log.push({d:Date.now(),t:$('#at').value,note:$('#an').value.trim(),cost:+$('#ac').value||0});save();render()}
function sell(id){
 const i=find(id),q=+$('#sq').value,pv=$('#sp').value,p=+pv;
 if(!(q>0)||pv===''||p<0){alert(L('needSale'));return}

const fmtT=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#+\s*/gm,'');
function prev(el){
 const f=el.files[0],p=$('#pv');if(!f){p.style.display='none';return}
 p.src=URL.createObjectURL(f);p.style.display='block'}
async function shrink(file){
 const url=URL.createObjectURL(file);
 const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
 const k=Math.min(1,1024/Math.max(img.width,img.height));
 const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
 c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
 return new Promise(r=>c.toBlob(r,'image/jpeg',.85))}
async function diagnose(){
 const f=$('#ph').files[0];
 if(!f){alert(L('needPhoto'));return}
 const box=$('#outc'),out=$('#out');box.style.display='block';out.textContent=L('looking');
 try{
  const sample=window.claude&&await claude.use('sample');
  const lim=sample&&await sample.limits();
  if(!sample||!lim||!lim.images){out.textContent=L('na');return}
  const blob=await shrink(f),kind=$('#hk').value,note=$('#hn').value.trim();
  const lang=['English','Sinhala (සිංහල)','Tamil (தமிழ்)'][LI];
  const q=`You are a friendly, practical farm advisor helping a small-scale farmer in Sri Lanka. The photo shows a sick or damaged ${kind}. Farmer’s note: ${note||'none'}.
Reply entirely in ${lang}, in very simple words and short sentences, with these four parts:
1. What it most likely is (and one or two other possibilities)
2. How serious it is
3. What to do today: cheap, safe steps first, using treatments available in Sri Lanka; name common treatments or medicines and say to follow the label
4. When to call a vet (Veterinary Surgeon) or the local agriculture instructor (Krushi Upadeshaka)
If the photo is unclear, say what extra photo would help. Never claim to be certain.`;
  const r=await sample(q,{images:[blob],cache:false,onText:({text})=>{out.innerHTML=fmtT(text)}});
  health.last=r.text;out.innerHTML=fmtT(r.text);
 }catch(e){
  const c=e&&e.code;
  out.textContent=c==='not_granted'?L('denied'):c==='rate_limited'?L('rate'):L('err')}}
